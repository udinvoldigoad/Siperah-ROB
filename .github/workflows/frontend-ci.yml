name: CI Frontend

# Sanity check tiap perubahan frontend: dependensi terpasang bersih dari
# lockfile, type-check TypeScript lolos, anggaran `any` tidak terlampaui, dan
# build production tidak error (termasuk guard ukuran chunk di vite.config.ts).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # 22, bukan 20 — Vite 8 (rolldown) mensyaratkan Node ^20.19.0 || >=22.12.0
      # untuk binding platformnya; "20" berisiko resolve ke patch di bawah
      # 20.19. Dev lokal memakai Node 24, jadi 22 LTS aman di kedua sisi.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc -b --noEmit

      # `tsc` tidak bisa menangkap ini: `any` justru bekerja dengan mematikan
      # pemeriksaan tipe, jadi pemakaiannya lolos tanpa keluhan. Batasnya nol.
      - name: Anggaran `any`
        run: npm run check:any

      - name: Build production
        run: npm run build
